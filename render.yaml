services:
  - type: web
    name: quotation-analyzer
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_GATEWAY_URL
        value: https://portfolio-llm-gateway.onrender.com/v1
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: openai/gpt-4o-mini
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: MAX_DOCUMENT_CHARS
        value: "90000"
      - key: REQUEST_TIMEOUT
        value: "120"
      - key: LLM_MAX_RETRIES
        value: "2"
      - key: OLLAMA_ENABLED
        value: "false"
